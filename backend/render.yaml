services:
  - type: web
    name: golf-score-backend
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/GolfScoreBackend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_OIDC_ISSUER_URI
        value: http://localhost:8081/realms/clubcard
